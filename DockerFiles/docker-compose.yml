services:

  # ============================================================
  # Gateway DB Migrator
  # Runs once, applies EF Core migrations, then exits
  # ============================================================
  gateway-migrate:
    build:
      context: ..
      dockerfile: DockerFiles/Migrations/Gateway.Migrator.Dockerfile
    image: flashsale-gateway-migrator
    container_name: flashsale-gateway-migrate

    environment:
      ConnectionStrings__default: "Server=gateway-sql,1433;Database=FlashSaleGatewayDb;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True;"

    depends_on:
      gateway-sql:
        condition: service_healthy

    networks:
      - flashsale-network
  # ============================================================
  # Gateway API
  # ============================================================
  # ============================================================
  # Gateway API
  # ============================================================
  gateway:
    build:
      context: ../GateWay
      dockerfile: ../DockerFiles/Gateway.Dockerfile

    image: flashsale-gateway
    container_name: flashsale-gateway

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      # ========================================================
      # Gateway SQL Server
      # ========================================================
      ConnectionStrings__default: "Server=gateway-sql,1433;Database=FlashSaleGatewayDb;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True;"

      # ========================================================
      # JWT
      # ========================================================
      Jwt__Secret: "this-is-a-dummy-secret-value-123"
      Jwt__Issuer: "Gateway"
      Jwt__Audience: "GatewayClient"
      Jwt__ExpirationInMinutes: "60000"
      Jwt__RefreshTokenExpirationInDays: "7"

      # ========================================================
      # Redis
      # ========================================================
      ConnectionStrings__Redis: "redis:6379"

      # ========================================================
      # RabbitMQ
      # ========================================================
      RabbitMQ__HostName: "rabbitmq"
      RabbitMQ__Port: "5672"
      RabbitMQ__UserName: "guest"
      RabbitMQ__Password: "guest"

      # ========================================================
      # YARP - Order Cluster
      # ========================================================
      ReverseProxy__Clusters__order-cluster__HttpClient__DangerousAcceptAnyServerCertificate: "true"

      ReverseProxy__Clusters__order-cluster__Destinations__order-api__Address: "http://order:8080/"

      # ========================================================
      # YARP - Inventory Cluster
      # ========================================================
      ReverseProxy__Clusters__inventory-cluster__HttpClient__DangerousAcceptAnyServerCertificate: "true"

      ReverseProxy__Clusters__inventory-cluster__Destinations__inventory-api__Address: "http://inventory:8080/"

    ports:
      - "5000:8080"

    depends_on:
      gateway-sql:
        condition: service_healthy

      gateway-migrate:
        condition: service_completed_successfully

      redis:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

    networks:
      - flashsale-network




  # ============================================================
  # Order DB Migrator (runs once, applies migrations, exits)
  # ============================================================
  order-migrate:
    build:
      context: ..
      dockerfile: DockerFiles/Migrations/Order.Migrator.Dockerfile
    image: flashsale-order-migrator
    container_name: flashsale-order-migrate
    environment:
      ConnectionStrings__default: "Server=order-sql,1433;Database=FlashSaleOrderDb;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True;"
    depends_on:
      order-sql:
        condition: service_healthy
    networks:
      - flashsale-network
  # ============================================================
  # Order API
  # ============================================================
  order:
    build:
      context: ../FlashSale.OrderManager.API
      dockerfile: ../DockerFiles/FlashSale.OrderManager.Dockerfile
    image: flashsale-order
    container_name: flashsale-order
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      # Order SQL Server
      ConnectionStrings__default: "Server=order-sql,1433;Database=FlashSaleOrderDb;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True;"

      # Redis
      ConnectionStrings__Redis: "redis:6379"

      # RabbitMQ
      RabbitMQ__HostName: "rabbitmq"
      RabbitMQ__Port: "5672"
      RabbitMQ__UserName: "guest"
      RabbitMQ__Password: "guest"

    ports:
      - "5001:8080"

    depends_on:
      order-sql:
        condition: service_healthy
      order-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    networks:
      - flashsale-network


  # ============================================================
  # Inventory DB Migrator
  # Runs once, applies EF Core migrations, then exits
  # ============================================================
  inventory-migrate:
    build:
      context: ..
      dockerfile: DockerFiles/Migrations/Inventory.Migrator.DockerFile
    image: flashsale-inventory-migrator
    container_name: flashsale-inventory-migrate

    environment:
      ConnectionStrings__default: "Server=inventory-sql,1433;Database=FlashSaleInventoryDb;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True;"

    depends_on:
      inventory-sql:
        condition: service_healthy

    networks:
      - flashsale-network

  # ============================================================
  # Inventory API
  # ============================================================
  inventory:
    build:
      context: ../FlashSale.InventoryManager.API
      dockerfile: ../DockerFiles/FlashSale.InventoryManager.Dockerfile
    image: flashsale-inventory
    container_name: flashsale-inventory

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      # Inventory SQL Server
      ConnectionStrings__default: "Server=inventory-sql,1433;Database=FlashSaleInventoryDb;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True;"

      # Redis
      ConnectionStrings__Redis: "redis:6379"

      # RabbitMQ
      RabbitMQ__HostName: "rabbitmq"
      RabbitMQ__Port: "5672"
      RabbitMQ__UserName: "guest"
      RabbitMQ__Password: "guest"

    ports:
      - "5002:8080"

    depends_on:
      inventory-sql:
        condition: service_healthy

      inventory-migrate:
        condition: service_completed_successfully

      redis:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

    networks:
    - flashsale-network



  # ============================================================
  # Gateway SQL Server
  # ============================================================
  gateway-sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: flashsale-gateway-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrongPassword123!"
      MSSQL_PID: "Developer"

    ports:
      - "14331:1433"

    volumes:
      - gateway-sql-data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\""
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

    networks:
      - flashsale-network


  # ============================================================
  # Order SQL Server
  # ============================================================
  order-sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: flashsale-order-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrongPassword123!"
      MSSQL_PID: "Developer"

    ports:
      - "14332:1433"

    volumes:
      - order-sql-data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\""
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

    networks:
      - flashsale-network


  # ============================================================
  # Inventory SQL Server
  # ============================================================
  inventory-sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: flashsale-inventory-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrongPassword123!"
      MSSQL_PID: "Developer"

    ports:
      - "14333:1433"

    volumes:
      - inventory-sql-data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\""
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

    networks:
      - flashsale-network


  # ============================================================
  # Redis
  # ============================================================
  redis:
    image: redis/redis-stack:latest
    container_name: flashsale-redis

    ports:
      - "6379:6379"
      - "8001:8001"

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    networks:
      - flashsale-network


  # ============================================================
  # RabbitMQ
  # ============================================================
  rabbitmq:
    image: rabbitmq:4-management
    container_name: flashsale-rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - flashsale-network


# ================================================================
# Volumes
# ================================================================
volumes:
  gateway-sql-data:
  order-sql-data:
  inventory-sql-data:
  redis-data:
  rabbitmq-data:


# ================================================================
# Network
# ================================================================
networks:
  flashsale-network:
    driver: bridge